<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasko - Daily Services</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">Tasko</div>
    <div class="location">📍 Select Location</div>
</header>

<main>

    <section class="hero">
        <h1>What service do you need?</h1>
        <p>Trusted professionals for your daily tasks.</p>
    </section>

    <section class="services">

        <div class="service-card">
            <div class="icon">🔧</div>
            <h3>Plumber</h3>
            <p>Pipe & water problems</p>
        </div>

        <div class="service-card">
            <div class="icon">⚡</div>
            <h3>Electrician</h3>
            <p>Electrical work</p>
        </div>

        <div class="service-card">
            <div class="icon">🛠️</div>
            <h3>Mechanic</h3>
            <p>Vehicle repair</p>
        </div>

        <div class="service-card">
            <div class="icon">🧹</div>
            <h3>Cleaning</h3>
            <p>Home cleaning</p>
        </div>

        <div class="service-card">
            <div class="icon">🎨</div>
            <h3>Painter</h3>
            <p>Painting work</p>
        </div>

        <div class="service-card">
            <div class="icon">➕</div>
            <h3>More</h3>
            <p>Other services</p>
        </div>

    </section>

</main>

<nav class="bottom-nav">
    <div class="nav-item active">🏠<span>Home</span></div>
    <div class="nav-item">📋<span>Bookings</span></div>
    <div class="nav-item">👤<span>Profile</span></div>
</nav>

<script src="script.js"></script>
</body>
</html>
